[workspace]
members = ["crates/world-language", "crates/world-kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
