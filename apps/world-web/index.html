    <button id="intersection-example" type="button" hidden></button>
   </section>
   <section id="formation" hidden aria-labelledby="formation-title" class="formation">
    <div class="formation-heading"><h2 id="formation-title"></h2><button type="button" id="formation-cancel"></button></div>
    <div class="formation-composition">
     <div class="formation-source"><p id="formation-source-label" class="quiet"></p><blockquote id="formation-quote" dir="auto"></blockquote></div>
     <div class="formation-sheet"><label for="formation-draft" id="formation-draft-label"></label><textarea id="formation-draft" rows="3" maxlength="12000" dir="auto"></textarea><button id="formation-keep" type="button" class="accent"></button></div>
    </div>
    <p id="formation-note" class="quiet"></p>
   </section>
   <section id="work-birth" hidden aria-labelledby="work-birth-title" class="work-birth">
    <div class="birth-heading"><h2 id="work-birth-title"></h2><p id="work-birth-note"></p></div>
    <div class="birth-materials">
     <div class="birth-piece first"><span id="birth-first-label"></span><blockquote id="birth-first" dir="auto"></blockquote></div>
     <div class="birth-piece second"><span id="birth-second-label"></span><blockquote id="birth-second" dir="auto"></blockquote></div>
    </div>
    <details id="birth-emergence"><summary id="birth-emergence-label"></summary><blockquote id="birth-emergence-text" dir="auto"></blockquote></details>
    <button id="birth-parent" type="button" hidden></button>
   </section>
   <section id="formation-lineage" hidden class="formation-lineage" aria-labelledby="lineage-label">
    <h2 id="lineage-label"></h2>
    <div id="origin-trace" hidden><button id="origin-back" type="button"></button><details><summary id="origin-excerpt-label"></summary><blockquote id="origin-excerpt" dir="auto"></blockquote></details></div>
    <div id="formed-works"></div>
   </section>
   
   <section id="mind" hidden class="mind" aria-labelledby="mind-title">
    <div class="mind-heading"><h2 id="mind-title"></h2><button id="mind-close" type="button"></button></div>
    <p id="mind-note" class="quiet"></p>
    <div id="mind-compose" hidden>
     <div class="connection-source"><span id="mind-source-caption" class="mind-subject"></span><blockquote id="mind-passage" dir="auto"></blockquote></div>
     <p id="mind-choice-label" class="connection-label"></p>
     <div class="mind-choices" role="group" aria-labelledby="mind-choice-label">
      <button type="button" id="mind-need" aria-pressed="false"><span id="mind-need-label"></span><small id="mind-need-example"></small></button>
      <button type="button" id="mind-ability" aria-pressed="false"><span id="mind-ability-label"></span><small id="mind-ability-example"></small></button>
     </div>
     <label for="mind-topic" id="mind-topic-label" class="connection-label"></label><input id="mind-topic" maxlength="80" dir="auto" autocomplete="off">
     <div class="connection-other"><label for="mind-counterpart" id="mind-counterpart-label" class="connection-label"></label><textarea id="mind-counterpart" rows="3" maxlength="1200" dir="auto"></textarea><p id="mind-counterpart-note" class="quiet"></p></div>
     <div class="actions"><button id="mind-keep" type="button" class="accent"></button><button id="mind-cancel" type="button"></button></div>
     <p id="mind-next" class="quiet" role="status"></p>
    </div>
    <div id="mind-echoes" class="mind-echoes" hidden></div>
    <div id="mind-links" class="mind-links"></div>
    <div id="mind-marks" class="mind-marks"></div><p id="mind-empty" class="quiet" hidden></p>
    <p id="mind-limit" class="quiet" hidden></p>
   </section>
   <section id="field-history" hidden class="field-history" aria-labelledby="field-history-title"><h2 id="field-history-title"></h2><p id="field-history-note"></p><div id="field-history-pieces" class="intersection-sources"></div><details><summary id="field-history-initial-label"></summary><blockquote id="field-history-initial" dir="auto"></blockquote></details><div class="field-question"><p id="field-history-question-label"></p><blockquote id="field-history-question" dir="auto"></blockquote></div></section>
   <section id="possibility-basis" hidden aria-labelledby="basis-title" class="possibility-basis"><h2 id="basis-title"></h2><p id="basis-note" class="quiet"></p><div id="basis-pieces"></div>
   </section>
   <details id="prior" hidden><summary id="prior-label"></summary><label class="sr" for="prior-text" id="prior-input-label"></label><textarea id="prior-text" rows="3" maxlength="6000" dir="auto"></textarea></details>
  </section>
  <section id="exchange" hidden aria-labelledby="exchange-label">
   <p id="exchange-stage" class="exchange-stage"></p>
   <div class="place-label"><span class="dot"></span><span id="exchange-label"></span></div>
   <p id="exchange-intro"></p>
   <div id="idea-object" class="idea-object">
    <div class="object-origin"><span id="idea-origin"></span><span id="object-mark"></span></div>
    <label for="excerpt" id="excerpt-label" class="sr"></label><textarea id="excerpt" maxlength="6000" rows="3" dir="auto"></textarea>
    <p id="carried-text" class="carried-text" dir="auto" hidden></p>
    <div id="exchange-voice" class="exchange-voice" hidden><p id="exchange-voice-label"></p><audio id="exchange-audio" controls preload="metadata"></audio><p id="exchange-voice-note"></p></div>
    <button id="grip" class="grip" hidden type="button"><svg viewBox="0 0 34 20" width="34" height="20" aria-hidden="true"><path d="M2 10h27m-7-7 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="grip-label"></span></button>
   </div>
   <div id="preparation" hidden class="preparation">
    <div class="address"><label for="recipient" id="recipient-label"></label><input id="recipient" maxlength="160" dir="auto" autocomplete="off"></div>
    <div class="identity"><label class="check"><input id="masked" type="checkbox" checked><span id="masked-label"></span></label><label for="person-name" id="person-label" hidden></label><input id="person-name" maxlength="120" dir="auto" autocomplete="off" hidden></div>
    <div id="destination" class="destination"><span id="destination-name"></span><button type="button" id="cast" class="accent"></button></div>
    <div class="field-departure"><button id="release-field" type="button" class="accent"></button><p id="release-note" class="quiet"></p></div>
    <div class="portable-departure"><button id="export-idea" type="button" class="accent"></button><p id="portable-note" class="quiet"></p></div>
    <p id="preview-note" class="quiet"></p>
   </div>
   <div id="reception" hidden>
    <p id="reply-prompt"></p>
    <label for="reply" id="reply-label" class="sr"></label><textarea id="reply" maxlength="6000" rows="2" dir="auto"></textarea>
    <div class="actions"><button id="reply-only"></button><button id="reply-meet" class="accent"></button><button id="decline"></button></div>
   </div>
   <div id="answer" hidden class="answer"><p id="answer-origin" class="quiet"></p><p id="answer-text" dir="auto"></p></div>
   <div id="return-actions" hidden class="actions"><button id="portable-keep" type="button" class="accent" hidden></button><button id="accept" class="accent" hidden></button><button id="back-private"></button></div>
   <div id="meeting" hidden class="meeting">
    <label for="common" id="common-label"></label><textarea id="common" maxlength="6000" rows="3" dir="auto"></textarea>
    <div class="actions"><button id="keep" class="accent"></button><button id="leave"></button></div><p class="quiet" id="meeting-note"></p>
   </div>
   <p id="portable-context" class="quiet" hidden></p><div class="exchange-foot"><button id="cancel"></button><span id="exchange-note" class="quiet"></span></div>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
 </div>
</main>
<footer class="world-foot"><span id="foot-note"></span><span class="coordinate" aria-hidden="true">TELEFSHEN</span></footer>
<dialog id="memory" aria-labelledby="memory-title"><div class="dialog-head"><h2 id="memory-title"></h2><button id="close-memory"></button></div><label class="sr" for="find" id="find-label"></label><input id="find" type="search" autocomplete="off"><div id="works"></div><div class="actions"><button id="new-work"></button><button id="forget"></button></div><p id="memory-note" class="quiet"></p></dialog>
<noscript>JavaScript is required for this local review. يلزم تشغيل JavaScript للمعاينة المحلية.</noscript>
</body></html>
