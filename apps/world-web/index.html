<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>World — local writing</title><link rel="stylesheet" href="world.css"><script src="world.js" defer></script>
</head>
<body>
<header><span class="signature" aria-hidden="true">world<span>.</span></span><nav aria-label="World"><button id="recall" hidden></button><button id="locale" lang="en">English</button></nav></header>
<main>
<section id="birth" class="birth" aria-labelledby="question"><p id="birth-kicker" class="eyebrow"></p><h1 id="question"></h1><form id="begin"><label id="seed-label" for="seed" class="sr"></label><textarea id="seed" rows="2" maxlength="240" required dir="auto"></textarea><div class="line"><button class="primary" id="start" type="submit"></button><span id="local-note" class="muted"></span></div></form></section>
<section id="living" hidden aria-labelledby="work-heading"><div class="work-layout"><article class="work"><p class="eyebrow" id="work-kicker"></p><h1 id="work-heading" tabindex="-1" dir="auto"></h1><label id="title-label" for="work-title" class="sr"></label><input id="work-title" maxlength="240" dir="auto" hidden><label id="body-label" for="body" class="sr"></label><textarea id="body" rows="7" maxlength="12000" dir="auto"></textarea><div class="line work-actions"><button id="rename"></button><button id="compose"></button><button id="share"></button><button id="save"></button></div><p class="muted" id="save-note"></p><section id="thought" hidden class="thought" aria-labelledby="thought-heading"><p class="eyebrow" id="thought-label"></p><h2 id="thought-heading"></h2><label for="thought-text" id="thought-input-label" class="sr"></label><textarea id="thought-text" maxlength="6000" rows="4" dir="auto"></textarea><div class="line"><button id="make" class="primary"></button><button id="discard"></button></div></section></article><aside id="context" hidden aria-labelledby="context-title"><div class="context-inner"><div class="line context-top"><p id="context-kicker" class="eyebrow"></p><button id="close-context" class="close"></button></div><h2 id="context-title"></h2><p id="context-help" class="muted"></p><div id="context-content"></div></div></aside></div></section>
<p id="status" role="status" aria-live="polite"></p>
</main>
<dialog id="memory" aria-labelledby="memory-title"><div class="line context-top"><h2 id="memory-title"></h2><button id="close-memory"></button></div><label for="find" id="find-label" class="sr"></label><input id="find" type="search" autocomplete="off"><div id="works"></div><div class="line memory-actions"><button id="new-work" class="primary"></button><button id="forget"></button></div><p id="memory-note" class="muted"></p></dialog>
<template id="share-template"><label id="excerpt-label" for="excerpt"></label><textarea id="excerpt" rows="5" maxlength="6000" dir="auto"></textarea><label id="receiver-label" for="receiver"></label><input id="receiver" maxlength="240" dir="auto"><p id="share-limit" class="muted"></p><button id="prepare" class="primary"></button><div id="prepared" hidden><h3 id="prepared-title"></h3><p id="preview-name" dir="auto"></p><p id="preview-text" class="preview" dir="auto"></p><p id="prepared-note" class="muted"></p></div></template>
<noscript>JavaScript is required for this local writing surface. يلزم تشغيل JavaScript لاستخدام مساحة الكتابة المحلية.</noscript>
</body></html>
