<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ONE WORLD</title><link rel="stylesheet" href="world.css"><script type="module" src="world.js"></script>
</head>
<body data-phase="private" data-presence="still">
<div class="daylight" aria-hidden="true"><div class="light-plane"></div><div class="horizon"></div></div>
<div id="presence-material" aria-hidden="true" class="presence-material">
<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="material-base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7b4cd"/><stop offset=".5" stop-color="#e5d9d7"/><stop offset="1" stop-color="#d7ddca"/></linearGradient>
  <radialGradient id="material-depth" cx=".15" cy=".75" r=".85" gradientTransform="matrix(1 0 0 .85 0 .10)"><stop stop-color="#839db5" stop-opacity=".69"/><stop offset=".6" stop-color="#a6b7c8" stop-opacity=".37"/><stop offset="1" stop-color="#a6b7c8" stop-opacity="0"/></radialGradient>
  <radialGradient id="material-rose" cx=".83" cy=".12" r=".73"><stop stop-color="#c498b6" stop-opacity=".67"/><stop offset="1" stop-color="#c498b6" stop-opacity="0"/></radialGradient>
  <radialGradient id="shared-light" cx=".52" cy=".43" r=".60" gradientTransform="matrix(1 0 0 .72 0 .12)"><stop stop-color="#fbf5e5" stop-opacity=".91"/><stop offset=".46" stop-color="#f8edda" stop-opacity=".67"/><stop offset="1" stop-color="#f8edda" stop-opacity="0"/></radialGradient>
  <radialGradient id="attention-light"><stop stop-color="#fff9e8" stop-opacity=".47"/><stop offset=".48" stop-color="#fff9e8" stop-opacity=".19"/><stop offset="1" stop-color="#fff9e8" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="1440" height="900" fill="url(#material-base)"/>
 <rect width="1440" height="900" fill="url(#material-depth)"/>
 <rect width="1440" height="900" fill="url(#material-rose)"/>
 <rect width="1440" height="900" fill="url(#shared-light)"/>
 <ellipse id="focus-light" cx="720" cy="450" rx="415" ry="290" fill="url(#attention-light)"/>
</svg>
</div>
<header class="world-edge">
 <span class="signature" aria-label="One World">one<span>world.</span></span>
 <div class="edge-actions"><span id="mode"></span><button id="locale" lang="en">English</button></div>
</header>
<main id="world" aria-label="One World">
 <div class="center">
  <section id="private" aria-labelledby="private-label">
   <div class="place-label"><span id="private-label"></span></div>
   <label for="name" id="name-label" class="sr"></label><input id="name" maxlength="240" dir="auto" hidden>
   <label for="thought" id="thought-label" class="sr"></label>
   <textarea id="thought" maxlength="12000" rows="3" dir="auto"></textarea>
   <div id="voice" class="voice-line">
    <button id="mic" class="mic" type="button" aria-pressed="false"><svg viewBox="0 0 36 36" width="34" height="34" aria-hidden="true"><rect x="14" y="6" width="8" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 17v1a8 8 0 0 0 16 0v-1M18 26v5m-5 0h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span id="mic-label"></span></button>
    <span id="voice-state" role="status"></span><audio id="clip" controls hidden preload="metadata"></audio><button id="clear-clip" hidden></button>
   </div>
   <div class="actions" id="private-actions"><button id="prepare" class="accent"></button><button id="resume" hidden></button><button id="save"></button><button id="recall"></button></div>
   <p id="private-note" class="quiet"></p>
   <details id="prior" hidden><summary id="prior-label"></summary><label class="sr" for="prior-text" id="prior-input-label"></label><textarea id="prior-text" rows="3" maxlength="6000" dir="auto"></textarea></details>
  </section>
  <section id="exchange" hidden aria-labelledby="exchange-label">
   <div class="place-label"><span class="dot"></span><span id="exchange-label"></span></div>
   <div id="idea-object" class="idea-object">
    <div class="object-origin"><span id="idea-origin"></span><span id="object-mark"></span></div>
    <label for="excerpt" id="excerpt-label" class="sr"></label><textarea id="excerpt" maxlength="6000" rows="3" dir="auto"></textarea>
    <p id="carried-text" class="carried-text" dir="auto" hidden></p>
    <button id="grip" class="grip" hidden type="button"><svg viewBox="0 0 34 20" width="34" height="20" aria-hidden="true"><path d="M2 10h27m-7-7 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="grip-label"></span></button>
   </div>
   <div id="preparation" hidden class="preparation">
    <div class="address"><label for="recipient" id="recipient-label"></label><input id="recipient" maxlength="160" dir="auto" autocomplete="off"></div>
    <div class="identity"><label class="check"><input id="masked" type="checkbox" checked><span id="masked-label"></span></label><label for="person-name" id="person-label" hidden></label><input id="person-name" maxlength="120" dir="auto" autocomplete="off" hidden></div>
    <div id="destination" class="destination"><span id="destination-name"></span><button type="button" id="cast" class="accent"></button></div>
    <p id="preview-note" class="quiet"></p>
   </div>
   <div id="reception" hidden>
    <label for="reply" id="reply-label" class="sr"></label><textarea id="reply" maxlength="6000" rows="2" dir="auto"></textarea>
    <div class="actions"><button id="reply-only"></button><button id="reply-meet" class="accent"></button><button id="decline"></button></div>
   </div>
   <div id="answer" hidden class="answer"><p id="answer-origin" class="quiet"></p><p id="answer-text" dir="auto"></p></div>
   <div id="return-actions" hidden class="actions"><button id="accept" class="accent" hidden></button><button id="back-private"></button></div>
   <div id="meeting" hidden class="meeting">
    <label for="common" id="common-label"></label><textarea id="common" maxlength="6000" rows="3" dir="auto"></textarea>
    <div class="actions"><button id="keep" class="accent"></button><button id="leave"></button></div><p class="quiet" id="meeting-note"></p>
   </div>
   <div class="exchange-foot"><button id="cancel"></button><span id="exchange-note" class="quiet"></span></div>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
 </div>
</main>
<footer class="world-foot"><span id="foot-note"></span><span class="coordinate" aria-hidden="true">ONE WORLD</span></footer>
<dialog id="memory" aria-labelledby="memory-title"><div class="dialog-head"><h2 id="memory-title"></h2><button id="close-memory"></button></div><label class="sr" for="find" id="find-label"></label><input id="find" type="search" autocomplete="off"><div id="works"></div><div class="actions"><button id="new-work"></button><button id="forget"></button></div><p id="memory-note" class="quiet"></p></dialog>
<noscript>JavaScript is required for this local review. يلزم تشغيل JavaScript للمعاينة المحلية.</noscript>
</body></html>
