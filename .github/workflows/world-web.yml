name: World web
on:
  push:
    paths:
      - 'apps/world-web/**'
      - '.github/workflows/world-web.yml'
  pull_request:
    paths:
      - 'apps/world-web/**'
      - '.github/workflows/world-web.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax and browser journey
        run: |
          node --check apps/world-web/world.js
          node --check apps/world-web/tests/browser.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/world-web >/tmp/world-web-http.log 2>&1 &
          trap 'kill $!' EXIT
          for n in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          browser="$(command -v google-chrome || command -v chromium)"
          profile="$(mktemp -d)"
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --user-data-dir="$profile" --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/tests/browser.html > /tmp/world-web-result.html
          cat /tmp/world-web-result.html
          grep -F 'PASS: local world, exact disclosure, distinct contributions, continuity, RTL/LTR, 320px' /tmp/world-web-result.html
      - name: Capture actual browser surfaces
        run: |
          mkdir -p visual
          python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/world-web >/tmp/world-visual-http.log 2>&1 &
          trap 'kill $!' EXIT
          for n in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          browser="$(command -v google-chrome || command -v chromium)"
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --user-data-dir="$(mktemp -d)" --window-size=1440,900 --virtual-time-budget=2000 --screenshot="$PWD/visual/01-first-encounter.png" http://127.0.0.1:8765/
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --user-data-dir="$(mktemp -d)" --window-size=1440,1100 --virtual-time-budget=3000 --screenshot="$PWD/visual/02-work-synthetic.png" http://127.0.0.1:8765/tests/visual.html
          # Synthetic screenshots only. Emit chunks for review through logs.
          echo 'BEGIN_ENCOUNTER_PNG'
          base64 -w 512 visual/01-first-encounter.png
          echo 'END_ENCOUNTER_PNG'
          echo 'BEGIN_WORK_PNG'
          base64 -w 512 visual/02-work-synthetic.png
          echo 'END_WORK_PNG'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-d01-visual-review
          path: visual/*.png
          retention-days: 14
          if-no-files-found: error
